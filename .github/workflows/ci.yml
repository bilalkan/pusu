name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Swift sürümü
        run: swift --version

      - name: Testler
        run: |
          swift build --product PusuTests
          .build/debug/PusuTests || {
            status=$?
            echo "PusuTests exit $status"
            codesign -dvv .build/debug/PusuTests 2>&1 || true
            /usr/bin/log show --last 2m --style compact --predicate 'eventMessage CONTAINS[c] "PusuTests" OR process == "kernel" AND eventMessage CONTAINS[c] "kill"' 2>/dev/null | tail -40 || true
            ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | tail -5
            exit $status
          }

      - name: Universal paket
        run: scripts/build.sh release

      - name: Paket kontrolü
        run: |
          lipo -archs build/Pusu.app/Contents/MacOS/Pusu | grep -q x86_64
          lipo -archs build/Pusu.app/Contents/MacOS/Pusu | grep -q arm64
          codesign --verify --strict --deep build/Pusu.app
          build/Pusu.app/Contents/MacOS/Pusu version
